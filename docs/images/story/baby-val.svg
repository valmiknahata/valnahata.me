<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1e17" />
      <stop offset="50%" stop-color="#3d2b21" />
      <stop offset="100%" stop-color="#201510" />
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d99163" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d99163" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#b1)"/>
  <rect width="800" height="500" fill="url(#glow3)"/>
  <!-- Minimalist Wonder & Toys motif -->
  <!-- Building blocks / Geometric structures -->
  <g transform="translate(320, 120)" stroke="#e8a87c" stroke-width="2" stroke-opacity="0.75" fill="none">
    <!-- Block 1 -->
    <polygon points="80,20 140,55 80,90 20,55" fill="#e8a87c" fill-opacity="0.12" />
    <polygon points="20,55 80,90 80,160 20,125" fill="#e8a87c" fill-opacity="0.22" />
    <polygon points="140,55 80,90 80,160 140,125" fill="#e8a87c" fill-opacity="0.08" />
    <!-- Floating sphere / wonder -->
    <circle cx="80" cy="-20" r="18" fill="#e8a87c" fill-opacity="0.45" />
    <circle cx="80" cy="-20" r="32" stroke-dasharray="3,3" stroke-width="1" stroke-opacity="0.5" />
  </g>
  <!-- Constellation / curiosity stars -->
  <circle cx="160" cy="180" r="3" fill="#ffd1b3" />
  <circle cx="220" cy="140" r="2" fill="#ffd1b3" />
  <circle cx="250" cy="210" r="2.5" fill="#ffd1b3" />
  <circle cx="620" cy="160" r="3" fill="#ffd1b3" />
  <circle cx="660" cy="220" r="2" fill="#ffd1b3" />
  <!-- Typography -->
  <text x="60" y="420" font-family="'Crimson Text', serif" font-size="24" fill="#ffffff" fill-opacity="0.9" font-style="italic">03 &middot; Origins &amp; Baby Val</text>
  <text x="60" y="450" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#d9ab8f" letter-spacing="1.5">EARLY CURIOSITY &middot; TAKING TOYS APART</text>
</svg>
